services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: normvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: normvault
      POSTGRES_PASSWORD: normvault
      POSTGRES_DB: normvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/maintenance/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normvault -d normvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
